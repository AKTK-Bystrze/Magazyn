{{ define "navbar" }}
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="/">Magazyn Bystrze</a>
    <a class="nav-link">{{.Name}}</a>
    <a class="nav-link">Godzinki : {{.Credits}}</a>
    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        {{ if contains "superAdmin" .Role }}
        <li class="nav-item">
          <a class="nav-link" href="/superAdmin/users">Użytkownicy</a>
        </li>
        {{end}}
        {{ if contains "admin" .Role }}
        <li class="nav-item">
          <a class="nav-link" href="/admin/reservations">Rezerwacje</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/admin/items">Sprzet</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/admin/inventory">Inwentaryzacja</a>
        </li>
        {{ end }}
        <li class="nav-item">
          <a class="nav-link" href="/search">Wyszukaj</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/dashboard">Twoje Rezerwacje</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/logout">Wyloguj</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
{{ end }}
