{{ define "stylesHome" }}

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
  integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
  crossorigin="anonymous"
/>
<style>
/* General Styles */
a {
    color: #FAB702; /* Orange color for the link */
    text-decoration: none; /* Remove underline from links */
}
textarea{
    width: 100%;  
    height: 100%; 
    box-sizing: border-box; 
}
:root {
            --orange: #fab702;
            --black: #191919;
            --grey: #202020;
            --blue: #333333;
            --light-grey: #959595;
        }

body {
    font-family: Dosis, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    color: #ffffff; /* White font color */
    background-color: #191919; /* Black background */
}

.header {
    font-family: Dosis, sans-serif;
}

.tile-text-content {
        padding: 10px;
        margin-top: 10;
    }

header h1 {
    display: inline-block;
    margin: 0;
}

header .menu {
    float: right;
}

/* Main Layout */
main {
    display: flex;
    justify-content: space-between;
}

.container{
    padding: 0px;
}

.left-column {
    flex: 3;
    margin-right: 20px;
}

.right-column {
    flex: 1;
}

/* Footer */
footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 10px 0;
    margin: 0 0px;
    position: relative;
}

/* Big news tile */
.big-news-tile {
    display: flex;
    border: 1px solid var(--orange);
    color:white;
    margin-bottom: 20px;
    margin-top: 20px;
    border-radius: 8px;
    overflow: hidden;
    background-color: var(--grey);
    font-family: Arial, sans-serif;
}
.big-tile-date-column {
    width: 50px;
    background-color: var(--orange);
    text-align: center;
    padding: 10px;
}
.big-tile-content-column {
    padding: 10px;
    flex: 1;
}
.big-tile-header {
    font-weight: bold;
    font-size: 1.2em;
}
.big-tile-author {
    font-style: italic;
    color: var(--light-grey);
    margin-top: 5px;
}

/* Small news tile */
.small-news-tile {
        margin-bottom: 20px;
        margin-top: 20px;
        border: 1px solid var(--orange);
        background-color: var(--grey);
        border-radius: 8px;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }
.small-tile-header {
    align-items: center;
    background-color: var(--blue);
    color: white;
    padding: 5px;
}

/* Responsive Design */
@media (max-width: 768px) {
    main {
        flex-direction: column;
    }

    .left-column,
    .right-column {
        flex: none;
        width: 100%;
        margin: 0;
    }
        .right-column {
        order: -1; 
    }
}
</style>
{{ end }}
