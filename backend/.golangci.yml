version: 2

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - goimports

formatters-settings:
  goimports:
    local-prefixes: magazyn/backend

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell

linters-settings:
  revive:
    rules:
      - name: var-naming
