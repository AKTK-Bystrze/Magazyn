version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - magazyn/backend

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: var-naming
