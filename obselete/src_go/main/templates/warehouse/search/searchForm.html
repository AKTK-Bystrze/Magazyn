{{ define "searchForm" }}
<form method="POST" action="/warehouse/user/search">
  <div class="form-group row">
    <label for="start_time" class="col-sm-2 col-form-label">Wypozyczenie:</label>
    <div class="col-sm-10">
      <input type="datetime-local" id="start_time" name="start_time" class="form-control" value="{{ .StartTime.Format "2006-01-02T15:04" }}" required>
    </div>
  </div>
  <div class="form-group row">
    <label for="end_time" class="col-sm-2 col-form-label">Zwrot:</label>
    <div class="col-sm-10">
      <input type="datetime-local" id="end_time" name="end_time" class="form-control" value="{{ .EndTime.Format "2006-01-02T15:04" }}" required>
    </div>
  </div>
  <div class="form-group row">
    <div class="col-sm-10 offset-sm-2">
      <button type="submit" class="btn btn-primary">Szukaj</button>
    </div>
  </div>
</form>
{{ end }}
