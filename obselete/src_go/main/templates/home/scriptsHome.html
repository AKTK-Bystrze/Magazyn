{{ define "scriptsHome" }}
<script>
  function createNews(newsType) {
    const formData = $('#new-news-form-' + newsType).serialize();
    fetch('/pages/ninja/news', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: formData
    })
      .then(response => {
        if (response.ok) {
          alert('Dodano wpis');
        } else {
          error = response.statusText;
          console.error('Error:', error);
          alert('UWAGA! nie dodano wpisu: ' + error);
        }
        response.text();
      })
      .catch(error => {
        console.error('Network error:', error);
        alert('Błąd sieci: ' + error);
      });
  }

  function deleteNews(newsId, newsType) {
    if (!confirm('Are you sure you want to delete this news item?')) {
      return;
    }

    fetch(`ninja/news/${newsId}?type=${newsType}`, {
      method: 'DELETE'
    })
      .then(response => {
        if (response.ok) {
          document.getElementById(newsType + newsId).remove();
          alert('News item deleted successfully');
        } else {
          console.error('Error:', response.statusText);
          alert('Failed to delete news item: ' + response.statusText);
        }
      })
      .catch(error => {
        console.error('Network error:', error);
        alert('Network error: ' + error);
      });
  }
</script>
{{end}}
