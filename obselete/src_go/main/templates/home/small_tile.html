{{ define "small_tile" }}
<div class="small-news-tile" id="SmallNews{{.newsData.ID}}">
    <div class="small-tile-header">
        {{ .newsData.Header }}
    </div>
    <div class="tile-text-content">
        {{ .newsData.Content }} 
    </div>
    {{if .UserInfo}}
    {{ if contains "ninja" .UserInfo.Role }}
        <button type="button" onclick="deleteNews({{ .newsData.ID }}, 'SmallNews')">Delete</button>
    {{end}}
{{end}}
    
</div>
{{end}}
