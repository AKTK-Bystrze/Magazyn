version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend/Dockerfile
    container_name: magazyn-backend
    restart: always
    expose:
      - "8080"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - magazyn-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend/Dockerfile
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
        PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
        PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    container_name: magazyn-frontend
    restart: always
    expose:
      - "4321"
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - INTERNAL_BACKEND_URL=http://backend:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4321"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - magazyn-network

  caddy:
    image: caddy:alpine
    container_name: magazyn-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - magazyn-network

volumes:
  caddy_data:
  caddy_config:

networks:
  magazyn-network:
    driver: bridge
