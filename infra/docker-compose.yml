version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend/Dockerfile
    container_name: magazyn-backend
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ../.env
    networks:
      - magazyn-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend/Dockerfile
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
        # Using Caddy proxy paths for client-side access
        PUBLIC_BACKEND_URL: http://localhost/api
        PUBLIC_APP_URL: http://localhost
    container_name: magazyn-frontend
    restart: unless-stopped
    expose:
      - "4321"
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      # Internal URL for SSR to talk to backend directly
      - INTERNAL_BACKEND_URL=http://backend:8080
    networks:
      - magazyn-network

  caddy:
    image: caddy:alpine
    container_name: magazyn-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - magazyn-network
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  magazyn-network:
    driver: bridge
