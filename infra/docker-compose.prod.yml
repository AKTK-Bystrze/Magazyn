version: '3.8'

services:
  backend:
    # Use the image built by GitHub Actions
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/magazyn-backend:${TAG:-latest}
    container_name: magazyn-backend
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    networks:
      - magazyn-network

  frontend:
    # Use the image built by GitHub Actions
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/magazyn-frontend:${TAG:-latest}
    container_name: magazyn-frontend
    restart: always
    expose:
      - "4321"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - INTERNAL_BACKEND_URL=http://backend:8080
    networks:
      - magazyn-network

  caddy:
    image: caddy:alpine
    container_name: magazyn-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - magazyn-network
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  magazyn-network:
    driver: bridge
