name: Run box tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: docker/setup-compose-action@v1 
      - name: Build docker images
        run: docker build --target test --build-arg DEBUG=true -t app -f app-dockerfile .
      - name: Setup containers
        working-directory: ./boxTest
        run: go run main.go --env
      - name: Run tests
        working-directory: ./boxTest
        run: go run main.go --tests
