name: Deploy to VPS

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0

env:
  REGISTRY: ghcr.io
  # TODO: Replace with your actual repository name if different
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # --- Build Backend ---
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- Build Frontend ---
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infra/frontend/Dockerfile
          build-args: |
             PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
             PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
             PUBLIC_BACKEND_URL=https://your-domain.com/api
             PUBLIC_APP_URL=https://your-domain.com
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,GITHUB_REPOSITORY_OWNER
          script: |
            # 1. Navigate to project directory (assumed to exist)
            cd /opt/magazyn

            # 2. Update code (optional, mainly to get new docker-compose.prod.yml if changed)
            # git pull origin main 
            # OR if not using git on server, you can SCP the file in a previous step.
            # For this example, we assume `git pull` works or files are stable.

            # 3. Export variables for docker-compose
            export TAG=$TAG
            export GITHUB_REPOSITORY_OWNER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')

            # 4. Login to registry (if images are private, otherwise skip)
            # echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 5. Pull new images
            docker compose -f infra/docker-compose.prod.yml pull

            # 6. Restart services
            docker compose -f infra/docker-compose.prod.yml up -d

            # 7. Cleanup unused images
            docker image prune -f
