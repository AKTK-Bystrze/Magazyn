# =============================================================================
# Pull Request Workflow
# =============================================================================
#
# DESCRIPTION:
#   Runs comprehensive checks on pull requests.
#   It includes linting, unit/integration testing for backend and frontend,
#   and E2E verification using a simplified local stack.
#
# TRIGGERS:
#   - Pull Request to main branch
#
# JOBS:
#   - lint-backend: GolangCI-Lint
#   - lint-frontend: ESLint
#   - test-backend: Unit & Integration tests (Go)
#   - test-frontend: Unit tests (Vitest)
#   - e2e-test: Full stack Playwright tests with local Supabase and Docker
#
# =============================================================================

name: PR

on:
  workflow_dispatch:
    inputs:
      run_pr_title_validation:
        description: 'Validate PR Title'
        required: false
        type: boolean
        default: true
      run_lint_backend:
        description: 'Lint Backend'
        required: false
        type: boolean
        default: true
      run_lint_frontend:
        description: 'Lint Frontend'
        required: false
        type: boolean
        default: true
      run_test_backend:
        description: 'Test Backend (Unit & Integration)'
        required: false
        type: boolean
        default: true
      run_test_frontend:
        description: 'Test Frontend (Unit)'
        required: false
        type: boolean
        default: true
      run_e2e_tests:
        description: 'E2E Tests'
        required: false
        type: boolean
        default: true
      run_changelog_preview:
        description: 'Generate Changelog Preview'
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: github.event_name == 'pull_request' || inputs.run_pr_title_validation
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request' || inputs.run_lint_backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          go-mod-path: 'backend/go.mod'
          go-sum-path: 'backend/go.sum'
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.61.0
      - name: Lint
        working-directory: ./backend
        run: make lint

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request' || inputs.run_lint_frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          package-lock-path: 'frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  test-backend:
    name: Unit & Integration Test Backend
    needs: [lint-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: (github.event_name == 'pull_request' || inputs.run_test_backend) && !cancelled()
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          go-mod-path: 'backend/go.mod'
          go-sum-path: 'backend/go.sum'

      - name: Setup Local Environment
        uses: ./.github/actions/setup-local-env
        with:
          context: host

      - name: Setup Supabase
        uses: ./.github/actions/setup-supabase
        with:
          mode: local

      - name: Unit Tests
        working-directory: ./backend
        run: go test ./internal/... -v -short -coverprofile=coverage.out

      - name: Integration Tests
        working-directory: ./backend
        run: go test ./internal/... -v -tags=integration

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  test-frontend:
    name: Unit Test Frontend
    needs: [lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: (github.event_name == 'pull_request' || inputs.run_test_frontend) && !cancelled()
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          package-lock-path: 'frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Test (with coverage)
        working-directory: ./frontend
        run: npm run test:coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e-test:
    name: E2E Test
    needs: [lint-backend, lint-frontend]
    if: (github.event_name == 'pull_request' || inputs.run_e2e_tests) && !cancelled()
    uses: ./.github/workflows/_e2e-tests.yml
    with:
      supabase-mode: local
      retries: 0

  generate-changelog-preview:
    name: Changelog Preview
    if: github.event_name == 'pull_request' || inputs.run_changelog_preview == true
    uses: ./.github/workflows/semantic-preview.yml
    permissions:
      contents: read

  update-pr-description:
    name: Update PR Description
    needs: [generate-changelog-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always() && (github.event_name == 'pull_request' || inputs.run_changelog_preview == true) && needs.generate-changelog-preview.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - name: Update Automated Section
        uses: actions/github-script@v7
        with:
          script: |
            const changelog = `${{ needs.generate-changelog-preview.outputs.changelog }}`;
            const nextVersion = '${{ needs.generate-changelog-preview.outputs.next_version }}';
            const releaseType = '${{ needs.generate-changelog-preview.outputs.release_type }}';
            const hasChanges = '${{ needs.generate-changelog-preview.outputs.has_changes }}' === 'true';
            
            // Determine emoji
            const emojiMap = { major: '🚨', minor: '✨', patch: '🐛' };
            const emoji = emojiMap[releaseType] || '📝';
            
            // Get current PR
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            let userContent = pr.body || '';
            
            // Remove old automated section if exists
            userContent = userContent.replace(/<!--\s*automatic-pr-description\s*-->[\s\S]*<!--\s*\/automatic-pr-description\s*-->/g, '').trim();
            
            // Build automated section
            let automatedSection = '\n\n<!-- automatic-pr-description -->\n';
            automatedSection += '## 📋 Changelog Preview\n\n';
            
            if (hasChanges) {
              automatedSection += `**${emoji} Release Impact:** \`${releaseType}\` → **${nextVersion}**\n\n`;
              automatedSection += changelog;
            } else {
              automatedSection += '**No release** (docs/chore only)\n';
            }
            
            automatedSection += '\n\n---\n*Auto-generated by semantic-release*\n';
            automatedSection += '<!-- /automatic-pr-description -->';
            
            // Update PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: userContent + automatedSection
            });
