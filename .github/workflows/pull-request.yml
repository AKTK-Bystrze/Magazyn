# =============================================================================
# Pull Request Workflow
# =============================================================================
#
# DESCRIPTION:
#   Runs comprehensive checks on pull requests.
#   It includes linting, unit/integration testing for backend and frontend,
#   and E2E verification using a simplified local stack.
#
# TRIGGERS:
#   - Pull Request to main branch
#
# JOBS:
#   - lint-backend: GolangCI-Lint
#   - lint-frontend: ESLint
#   - test-backend: Unit & Integration tests (Go)
#   - test-frontend: Unit tests (Vitest)
#   - e2e-test: Full stack Playwright tests with local Supabase and Docker
#   - status-comment: Posts a summary comment on the PR on success
#
# =============================================================================

name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Docker containers use host.docker.internal to reach local Supabase on host
  PUBLIC_SUPABASE_URL: http://host.docker.internal:54321
  PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  PORT: 8080
  E2E_TEST_EMAIL: test.dev.g6@gmail.com
  E2E_TEST_PASSWORD: TestSecurePassword123!
  E2E_BASE_URL: http://localhost
  CORS_ALLOWED_ORIGINS: http://localhost

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          go-mod-path: 'backend/go.mod'
          go-sum-path: 'backend/go.sum'
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.61.0
      - name: Lint
        working-directory: ./backend
        run: make lint

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          package-lock-path: 'frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  test-backend:
    name: Unit & Integration Test Backend
    needs: [lint-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Override Supabase URL for backend tests - they run on host, not in Docker
    env:
      PUBLIC_SUPABASE_URL: http://localhost:54321
    steps:
      - uses: actions/checkout@v4


      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          go-mod-path: 'backend/go.mod'
          go-sum-path: 'backend/go.sum'

      - name: Setup Supabase
        uses: ./.github/actions/setup-supabase
        with:
          mode: local

      - name: Unit Tests
        working-directory: ./backend
        run: go test ./internal/... -v -short -coverprofile=coverage.out

      - name: Integration Tests
        working-directory: ./backend
        run: go test ./internal/... -v -tags=integration

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  test-frontend:
    name: Unit Test Frontend
    needs: [lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          package-lock-path: 'frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Test (with coverage)
        working-directory: ./frontend
        run: npm run test:coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e-test:
    name: E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup Supabase
        uses: ./.github/actions/setup-supabase
        with:
          mode: local

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Configure host.docker.internal
        run: |
          # Add host.docker.internal to /etc/hosts so browser can resolve it
          # This is needed because frontend is built with PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
          # and Playwright browser runs on the host, not inside Docker
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Deploy E2E Stack
        uses: ./.github/actions/deploy-e2e-stack
        with:
          supabase-url: ${{ env.PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ env.PUBLIC_SUPABASE_ANON_KEY }}
          supabase-service-role-key: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}







      - name: Run E2E Tests
        working-directory: ./frontend
        run: npx playwright test --workers=4 --retries=0

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        working-directory: ./infra
        run: docker compose down -v

  status-comment:
    name: Status Comment
    needs: [test-backend, test-frontend, e2e-test]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: success()
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### ✅ Verification Successful\n\nAll checks passed:\n- **Backend**: Lint, Unit & Integration Tests\n- **Frontend**: Lint & Unit Tests\n- **E2E**: Parallel (4 workers)'
            })
