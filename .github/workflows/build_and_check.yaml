steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-go@v5
    with:
      go-version: '1.20'
  - name: Build apps
    working-directory: ./src/apps  
    run: go build
  - name: Test apps
    working-directory: ./src/apps
    run: go test
  - name: Build main
    working-directory: ./src/main
    run: go build
  - name: Test main
    working-directory: ./src/main
    run: go test
