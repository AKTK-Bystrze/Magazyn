# =============================================================================
# Release Workflow
# =============================================================================
#
# DESCRIPTION:
#   Builds, tests, and creates a new version tag for the application.
#   Runs E2E tests against a remote Supabase test database before tagging.
#
# TRIGGERS:
#   - Push to main branch (production releases)
#   - Push to magazyn_2_0 branch (testing - remove after verification)
#   - Manual trigger via workflow_dispatch with optional tag version
#
# VERSIONING:
#   - If tag_version input is provided: uses that exact version
#   - If tag_version is empty: auto-increments patch version (v1.0.0 -> v1.0.1)
#   - Tags are prefixed with 'v' automatically if missing
#
# REQUIRED SECRETS:
#   - TEST_SUPABASE_URL: Supabase project URL for testing
#   - TEST_SUPABASE_ANON_KEY: Supabase anonymous key
#   - TEST_SUPABASE_SERVICE_ROLE_KEY: Supabase service role key
#   - TEST_SUPABASE_DB_PASSWORD: Database password for migrations
#   - SUPABASE_ACCESS_TOKEN: CLI access token for migrations
#   - E2E_TEST_EMAIL: Test user email
#   - E2E_TEST_PASSWORD: Test user password
#
# =============================================================================

name: Release new version

on:
  push:
    branches: [main, magazyn_2_0]
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag version (e.g., v1.2.3). Leave empty to auto-increment.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
  E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
  E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
  PORT: 8080
  E2E_BASE_URL: http://localhost:4321
  CORS_ALLOWED_ORIGINS: http://localhost:4321
  SUPABASE_DB_PASSWORD: ${{ secrets.TEST_SUPABASE_DB_PASSWORD }}

jobs:
  release:
    name: Build, Test & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: integration
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Migrations to Test DB
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: PUBLIC_SUPABASE_URL is empty. Make sure TEST_SUPABASE_URL secret is configured."
            exit 1
          fi
          
          PROJECT_REF=$(echo "$PUBLIC_SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          
          if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "$PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: Could not extract project ref from URL: $PUBLIC_SUPABASE_URL"
            echo "Expected format: https://<project-ref>.supabase.co"
            exit 1
          fi
          
          echo "Pushing migrations to project: $PROJECT_REF"
          
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${SUPABASE_DB_PASSWORD}', safe=''))")
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENCODED_PASSWORD}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"
          
          echo "Pushing migrations to remote test database..."
          supabase db push --db-url "$DB_URL" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build Frontend
        working-directory: ./frontend
        env:
          PUBLIC_BACKEND_URL: http://localhost:8080
          PUBLIC_APP_URL: http://localhost:4321
        run: npm run build

      - name: Start Backend
        working-directory: ./backend
        run: |
          go run cmd/api/main.go &
          BACKEND_PID=$!
          echo "Backend started (pid $BACKEND_PID)"
          
          echo "Waiting for backend health check..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Backend is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          
          echo "ERROR: Backend failed to start within 30 seconds"
          exit 1

      - name: Start Frontend
        working-directory: ./frontend
        run: |
          npm run preview &
          FRONTEND_PID=$!
          echo "Frontend started (pid $FRONTEND_PID)"
          
          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -sf http://localhost:4321 > /dev/null 2>&1; then
              echo "Frontend is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          
          echo "ERROR: Frontend failed to start within 30 seconds"
          exit 1
        env:
          HOST: 0.0.0.0
          PORT: 4321

      - name: Run E2E Tests
        working-directory: ./frontend
        run: |
          set -e
          npx playwright test --workers=4 --retries=1
          E2E_EXIT_CODE=$?
          echo "E2E tests completed with exit code: $E2E_EXIT_CODE"
          exit $E2E_EXIT_CODE

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Determine Next Version
        id: version
        run: |
          INPUT_TAG="${{ inputs.tag_version }}"
          
          if [ -n "$INPUT_TAG" ]; then
            if [[ "$INPUT_TAG" != v* ]]; then
              NEW_VERSION="v${INPUT_TAG}"
            else
              NEW_VERSION="$INPUT_TAG"
            fi
            echo "Using provided tag: $NEW_VERSION"
          else
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            
            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="v1.0.0"
            else
              VERSION=${LATEST_TAG#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
            
            echo "Latest tag: $LATEST_TAG"
          fi
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Release ${{ steps.version.outputs.version }}"
          
          git push origin "${{ steps.version.outputs.version }}"
          
          echo "✅ Created and pushed tag: ${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            **Commit**: ${{ github.sha }}
            **Build**: ${{ github.run_number }}
            
            ### Verified
            - ✅ Migrations pushed to test database
            - ✅ E2E tests passed
          draft: false
          prerelease: false
