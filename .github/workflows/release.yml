# =============================================================================
# Release Workflow
# =============================================================================
#
# DESCRIPTION:
#   Opens a Release Please PR with the next version and changelog.
#   The GitHub release and tag are created after the PR is merged.
#
# TRIGGERS:
#   - Push to main branch (create/update release PR or publish a merged release PR)
#   - Manual trigger via workflow_dispatch
#
# VERSIONING:
#   Uses Conventional Commits to determine version:
#   - fix: → Patch bump (v1.0.0 → v1.0.1)
#   - feat: → Minor bump (v1.0.0 → v1.1.0)
#   - feat!: or BREAKING CHANGE: → Major bump (v1.0.0 → v2.0.0)
#
# REQUIRED SECRETS:
#   - RELEASE_PLEASE_TOKEN: PAT used to create release PRs and trigger their CI
#
# =============================================================================

name: Release new version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or publish release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
