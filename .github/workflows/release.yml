# =============================================================================
# Release Workflow
# =============================================================================
#
# DESCRIPTION:
#   Builds, tests, and creates a new version release using semantic-release.
#   Runs E2E tests against the full stack (backend, frontend, Caddy) using
#   Docker Compose and a remote Supabase test database before releasing.
#
# TRIGGERS:
#   - Push to main branch (production releases)
#   - Manual trigger via workflow_dispatch
#
# VERSIONING:
#   Uses semantic-release to determine version based on commit messages:
#   - fix: → Patch bump (v1.0.0 → v1.0.1)
#   - feat: → Minor bump (v1.0.0 → v1.1.0)
#   - feat!: or BREAKING CHANGE: → Major bump (v1.0.0 → v2.0.0)
#
# REQUIRED SECRETS:
#   - PUBLIC_SUPABASE_URL: Supabase project URL
#   - PUBLIC_SUPABASE_ANON_KEY: Supabase anonymous key
#   - SUPABASE_SERVICE_ROLE_KEY: Supabase service role key
#   - TEST_SUPABASE_DB_PASSWORD: Database password for migrations
#   - SUPABASE_ACCESS_TOKEN: CLI access token for migrations
#   - E2E_TEST_EMAIL: Test user email
#   - E2E_TEST_PASSWORD: Test user password
#
# =============================================================================

name: Release new version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
  E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
  PORT: 8080
  E2E_BASE_URL: http://localhost
  CORS_ALLOWED_ORIGINS: http://localhost
  SUPABASE_DB_PASSWORD: ${{ secrets.TEST_SUPABASE_DB_PASSWORD }}

jobs:
  release:
    name: Build, Test & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: integration
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Supabase Project
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: PUBLIC_SUPABASE_URL is empty. Make sure TEST_SUPABASE_URL secret is configured."
            exit 1
          fi
          
          PROJECT_REF=$(echo "$PUBLIC_SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          
          if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "$PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: Could not extract project ref from URL: $PUBLIC_SUPABASE_URL"
            echo "Expected format: https://<project-ref>.supabase.co"
            exit 1
          fi
          
          echo "Configuring project: $PROJECT_REF"
          
          mkdir -p supabase/.temp
          cat > supabase/.temp/project-ref <<EOF
          $PROJECT_REF
          EOF
          
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${SUPABASE_DB_PASSWORD}', safe=''))")
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENCODED_PASSWORD}@aws-1-eu-central-1.pooler.supabase.com:6543/postgres"
          
          echo "DB_URL=$DB_URL" >> supabase/.temp/db-url
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Migrations to Test DB
        run: |
          PROJECT_REF=$(cat supabase/.temp/project-ref)
          DB_URL=$(cat supabase/.temp/db-url | cut -d'=' -f2-)
          
          echo "Pushing migrations to project: $PROJECT_REF"
          supabase db push --db-url "$DB_URL" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Deploy E2E Stack
        uses: ./.github/actions/deploy-e2e-stack
        with:
          supabase-url: ${{ env.PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ env.PUBLIC_SUPABASE_ANON_KEY }}
          supabase-service-role-key: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run E2E Tests
        working-directory: ./frontend
        run: |
          set -e
          echo "Running E2E tests against full stack at http://localhost"
          npx playwright test --workers=4 --retries=1
          E2E_EXIT_CODE=$?
          echo "E2E tests completed with exit code: $E2E_EXIT_CODE"
          exit $E2E_EXIT_CODE

      - name: Capture Service Logs on Failure
        if: failure()
        working-directory: ./infra
        run: |
          echo "=================================================="
          echo "SERVICE LOGS - E2E Test Failure Debug Information"
          echo "=================================================="
          
          echo ""
          echo "=== Container Status ==="
          docker compose ps
          
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs backend
          
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs frontend
          
          echo ""
          echo "=== Caddy Logs ==="
          docker compose logs caddy
          
          echo ""
          echo "=================================================="

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Cleanup Services
        if: always()
        working-directory: ./infra
        run: |
          echo "Stopping and removing containers..."
          docker compose down -v --remove-orphans
          echo "✅ Cleanup complete"

      - name: Semantic Release
        working-directory: ./frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

