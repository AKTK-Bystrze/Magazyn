# =============================================================================
# Release Workflow
# =============================================================================
#
# DESCRIPTION:
#   Builds, tests, and creates a new version tag for the application.
#   Runs E2E tests against the full stack (backend, frontend, Caddy) using
#   Docker Compose and a remote Supabase test database before tagging.
#
# TRIGGERS:
#   - Push to main branch (production releases)
#   - Manual trigger via workflow_dispatch with optional tag version
#
# VERSIONING:
#   - If tag_version input is provided: uses that exact version
#   - If tag_version is empty: auto-increments patch version (v1.0.0 -> v1.0.1)
#   - Tags are prefixed with 'v' automatically if missing
#
# REQUIRED SECRETS:
#   - PUBLIC_SUPABASE_URL: Supabase project URL
#   - PUBLIC_SUPABASE_ANON_KEY: Supabase anonymous key
#   - SUPABASE_SERVICE_ROLE_KEY: Supabase service role key
#   - TEST_SUPABASE_DB_PASSWORD: Database password for migrations
#   - SUPABASE_ACCESS_TOKEN: CLI access token for migrations
#   - E2E_TEST_EMAIL: Test user email
#   - E2E_TEST_PASSWORD: Test user password
#
# =============================================================================

name: Release new version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag version (e.g., v1.2.3). Leave empty to auto-increment.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
  E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
  PORT: 8080
  E2E_BASE_URL: http://localhost
  CORS_ALLOWED_ORIGINS: http://localhost
  SUPABASE_DB_PASSWORD: ${{ secrets.TEST_SUPABASE_DB_PASSWORD }}

jobs:
  release:
    name: Build, Test & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: integration
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Supabase Project
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: PUBLIC_SUPABASE_URL is empty. Make sure TEST_SUPABASE_URL secret is configured."
            exit 1
          fi
          
          PROJECT_REF=$(echo "$PUBLIC_SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          
          if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "$PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: Could not extract project ref from URL: $PUBLIC_SUPABASE_URL"
            echo "Expected format: https://<project-ref>.supabase.co"
            exit 1
          fi
          
          echo "Configuring project: $PROJECT_REF"
          
          mkdir -p supabase/.temp
          cat > supabase/.temp/project-ref <<EOF
          $PROJECT_REF
          EOF
          
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${SUPABASE_DB_PASSWORD}', safe=''))")
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENCODED_PASSWORD}@aws-1-eu-central-1.pooler.supabase.com:6543/postgres"
          
          echo "DB_URL=$DB_URL" >> supabase/.temp/db-url
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Migrations to Test DB
        run: |
          PROJECT_REF=$(cat supabase/.temp/project-ref)
          DB_URL=$(cat supabase/.temp/db-url | cut -d'=' -f2-)
          
          echo "Pushing migrations to project: $PROJECT_REF"
          supabase db push --db-url "$DB_URL" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Deploy E2E Stack
        uses: ./.github/actions/deploy-e2e-stack
        with:
          supabase-url: ${{ env.PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ env.PUBLIC_SUPABASE_ANON_KEY }}
          supabase-service-role-key: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}







      - name: Run E2E Tests
        working-directory: ./frontend
        run: |
          set -e
          echo "Running E2E tests against full stack at http://localhost"
          npx playwright test --workers=4 --retries=1
          E2E_EXIT_CODE=$?
          echo "E2E tests completed with exit code: $E2E_EXIT_CODE"
          exit $E2E_EXIT_CODE

      - name: Capture Service Logs on Failure
        if: failure()
        working-directory: ./infra
        run: |
          echo "=================================================="
          echo "SERVICE LOGS - E2E Test Failure Debug Information"
          echo "=================================================="
          
          echo ""
          echo "=== Container Status ==="
          docker compose ps
          
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs backend
          
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs frontend
          
          echo ""
          echo "=== Caddy Logs ==="
          docker compose logs caddy
          
          echo ""
          echo "=================================================="

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Cleanup Services
        if: always()
        working-directory: ./infra
        run: |
          echo "Stopping and removing containers..."
          docker compose down -v --remove-orphans
          echo "✅ Cleanup complete"

      - name: Determine Next Version
        id: version
        run: |
          INPUT_TAG="${{ inputs.tag_version }}"
          
          if [ -n "$INPUT_TAG" ]; then
            if [[ "$INPUT_TAG" != v* ]]; then
              NEW_VERSION="v${INPUT_TAG}"
            else
              NEW_VERSION="$INPUT_TAG"
            fi
            echo "Using provided tag: $NEW_VERSION"
          else
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            
            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="v1.0.0"
            else
              VERSION=${LATEST_TAG#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
            
            echo "Latest tag: $LATEST_TAG"
          fi
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Release ${{ steps.version.outputs.version }}"
          
          git push origin "${{ steps.version.outputs.version }}"
          
          echo "✅ Created and pushed tag: ${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            **Commit**: ${{ github.sha }}
            **Build**: ${{ github.run_number }}
            
            ### Verified
            - ✅ Migrations pushed to test database
            - ✅ E2E tests passed
          draft: false
          prerelease: false
