name: Go lint
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Lint src
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ./src
          version: v2.1
      - name: Lint box test
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ./boxTest
          version: v2.1
