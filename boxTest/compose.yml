version: '3.8'

services:
  web:
    build:
      context: ..                     
      dockerfile: app-dockerfile    
      target: test                   
      args:                          
        EMAIL: test_app@bystrzeMail.com
        COOKIE_KEY:    
        EMAIL_PASS: password
    ports:
      - "8080:8080"
    environment:
      - SMTP_HOST=test_server       
      - SMTP_PORT=587                 
      - DEBUG=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/magazyn?sslmode=disable
    cap_add:
      - SYS_TIME                      
    depends_on:
      - db
    networks:
      - app-network

  db:
    build:
      context: ..
      dockerfile: db-dockerfile
    options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: magazyn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
