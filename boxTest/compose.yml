version: '3.8'

services:
  web:
    build:
      context: ..                     
      dockerfile: app-dockerfile    
      target: test                   
      args:                          
        EMAIL: test_app@bystrzeMail.com
        COOKIE_KEY:    
        EMAIL_PASS: password
    ports:
      - "8080:8080"
    environment:
      - SMTP_HOST=test_server       
      - SMTP_PORT=587                 
      - DEBUG=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/magazyn?sslmode=disable
    cap_add:
      - SYS_TIME                      
    depends_on:
      - db:
        condition: service_healthy
    networks:
      - app-network

  db:
    build:
      context: ..
      dockerfile: db-dockerfile
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: magazyn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge
