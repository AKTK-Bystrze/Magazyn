{{ define "stylesInclude" }}

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
  integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
  crossorigin="anonymous"
/>
{{ if .DataTables }}
<link
  href="https://cdn.datatables.net/v/bs4/dt-1.13.4/date-1.4.0/r-2.4.1/datatables.min.css"
  rel="stylesheet"
/>
<style type="text/css">
  .dataTables_wrapper {
    margin-top: 5px;
  }
</style>
{{ end }}
 <style>
    #listSection {
        flex-grow: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 10px;
        padding: 10px;
    }
    .equipment-tile {
        padding: 5px;
        background-color: lightblue;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 14px;
        height: 40px;
    }
    .equipment-tile.duplicate {
        background-color: yellow;
    }
    .equipment-tile.db-extra {
        background-color: green;
    }
    .equipment-tile.list-extra {
        background-color: red;
    }
    #controlSection {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    #equipmentInput {
        padding: 10px;
        font-size: 18px;
        flex-grow: 1;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin: 10px;
        background-color: white;
    }
    .inventoryButton {
        padding: 10px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        background-color: lightblue;
        border-radius: 5px;
        margin-right: 10px;
    }
    .inventoryButton:hover {
        background-color: deepskyblue;
    }
  </style>
{{ end }}
