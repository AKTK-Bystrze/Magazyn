<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Manager</title>
    {{ template "stylesInclude" dict "DataTables" true}} {{ template
        "scriptsInclude" dict "DataTables" true }}
   
</head>
<body>

    <div id="listSection"></div>
    <div id="controlSection">
        <input type="text" id="equipmentInput" placeholder="ID sprzętu">
    </div>
    <div id="controlSection">
        <button class="inventoryButton" onclick="addFromInput()">Dodaj</button>
        <button class="inventoryButton" onclick="filterList()">Filtruj</button>
        <button class="inventoryButton" onclick="checkDuplicates()">Sprawdź</button>
        <button class="inventoryButton" onclick="downloadList()">Pobierz</button>
    </div>

    <script>
        let equipmentArray = ["WG11", "WG2", "NW3"];  // Example initial data
        const dbValues = ["WG11", "WG2", "WG3"];  // Example DB values

        function addEquipment(value) {
            if (value) {
                equipmentArray.push(value);
                updateListView();
            }
        }

        function addFromInput() {
            const inputValue = document.getElementById('equipmentInput').value.trim();
            addEquipment(inputValue.toUpperCase());
            document.getElementById('equipmentInput').value = '';
        }

        function updateListView() {
            const listSection = document.getElementById('listSection');
            listSection.innerHTML = '';
            equipmentArray.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'equipment-tile';
                btn.innerText = item;
                btn.onclick = () => removeEquipment(index);
                listSection.appendChild(btn);
            });
        }

        function removeEquipment(index) {
            equipmentArray.splice(index, 1);
            updateListView();
        }

        function filterList() {
            // Implement filter logic based on your needs
            alert("Filter function not implemented yet.");
        }

        function checkDuplicates() {
            //dodawanie jest ok, niech resetuje widok
            //sprawdz jest ok
            //jezeli jakis item jest na zielono to jest zdublowany, Czyli jest niebieski item i zielony a powinien być tylko zielony
            //usuwanie niepotrzebnie resetuje widok tzn kolory
            
            //czy klawiatura jest widoczna caly czas?
            //powinien ignorowac rozmiar czcionki
            //duplikat powinien byc podswietlony zaraz po dodaniu czyli duplikaty weryfikowane tez po dodaniu
            //dodawanie 
            const listSection = document.getElementById('listSection');
            listSection.innerHTML = '';

            const duplicates = equipmentArray.filter((item, index) => equipmentArray.indexOf(item) !== index);
            const uniqueItems = [...new Set(equipmentArray)];
            
            uniqueItems.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'equipment-tile';
                btn.innerText = item;
                btn.onclick = () => removeEquipment(index);

                if (duplicates.includes(item)) {
                    btn.classList.add('duplicate');
                }

                listSection.appendChild(btn);
            });

            uniqueItems.forEach((item) => {
                if (!dbValues.includes(item)) {
                    const btn = document.createElement('button');
                    btn.className = 'equipment-tile db-extra';
                    btn.innerText = item;
                    listSection.appendChild(btn);
                }
            });

            dbValues.forEach((item) => {
                if (!uniqueItems.includes(item)) {
                    const btn = document.createElement('button');
                    btn.className = 'equipment-tile list-extra';
                    btn.innerText = item;
                    btn.onclick = () => removeEquipment(index);
                    listSection.appendChild(btn);
                }
            });
        }

        function downloadList() {
            const blob = new Blob([equipmentArray.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'equipment_list.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        updateListView();

        document.onkeydown = function(e) {
            if (e.key === 'Enter') {
                addFromInput();
            } else if (e.key === 'Backspace') {
                document.getElementById('equipmentInput').value = 
                    document.getElementById('equipmentInput').value.slice(0, -1);
            }
        };
    </script>

</body>
</html>
