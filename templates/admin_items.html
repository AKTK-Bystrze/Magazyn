<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dostepny sprzet</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="#">Magazyn Bystrze</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <a class="nav-link" href="/admin/reservations">Rezerwacje</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin/items">Sprzet</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/logout">Wyloguj</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      <h2 class="my-3">Dostepny sprzet</h2>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nazwa</th>
            <th>Opis</th>
            <th>Status</th>
            <th>Zmien Status</th>
          </tr>
        </thead>
        <tbody>
          {{ range .Items }}
          <tr>
            <td>{{ .ID }}</td>
            <td>{{ .Name }}</td>
            <td>{{ .Description }}</td>
            <td>
              {{ if eq .Status "ok" }}
              <span class="badge badge-success">OK</span>
              {{ else if eq .Status "broken" }}
              <span class="badge badge-danger">Zepsute</span>
              {{ else if eq .Status "hidden" }}
              <span class="badge badge-secondary">Ukryte</span>
              {{ end }}
            </td>
            <td>
              <form method="POST" action="/admin/item/status">
                <input type="hidden" name="id" value="{{ .ID }}">
                <div class="form-group">
                  <select class="form-control" name="status" onchange="this.form.submit()">
                    <option value="ok" {{ if eq .Status "ok" }}selected{{ end }}>OK</option>
                    <option value="broken" {{ if eq .Status "broken" }}selected{{ end }}>Zepsute</option>
                    <option value="hidden" {{ if eq .Status "hidden" }}selected{{ end }}>Ukryte</option>
                  </select>
                </div>
              </form>
            </td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
