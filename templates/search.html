<!DOCTYPE html>
<html>
<head>
	<title>Wyszukaj Sprzet</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
	<style>
		.row {
			margin-bottom: 10px;
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container">
			<a class="navbar-brand" href="#">Magazyn Bystrze</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ml-auto">
					<li class="nav-item">
						<a class="nav-link" href="/search">Search</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/dashboard">Dashboard</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/logout">Logout</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container">
		<h1 class="mt-3">Wyszukaj Sprzet</h1>
		{{ if .Msg }}
		<p>{{ .Msg }}<p>
		{{ end }}
		<form method="GET" action="/search">
			<div class="form-group row">
				<label for="start_time" class="col-sm-2 col-form-label">Start Time:</label>
				<div class="col-sm-10">
					<input type="datetime-local" id="start_time" name="start_time" class="form-control" value="{{ .StartTime.Format "2006-01-02T15:04" }}" required>
				</div>
			</div>
			<div class="form-group row">
				<label for="end_time" class="col-sm-2 col-form-label">End Time:</label>
				<div class="col-sm-10">
					<input type="datetime-local" id="end_time" name="end_time" class="form-control" value="{{ .EndTime.Format "2006-01-02T15:04" }}" required>
				</div>
			</div>
			<div class="form-group row">
				<div class="col-sm-10 offset-sm-2">
					<button type="submit" class="btn btn-primary">Search</button>
				</div>
			</div>
		</form>
		{{ if .AvailableChairs }}
			<h2 class="mt-5">Dostepny Sprzet:</h2>
			{{ range .AvailableChairs }}
				<div class="row border rounded">
					<div class="col-md-4 col-lg-3 py-3 px-4">
						<h4>{{ .Name }}</h4>
						<p>{{ .Desc }}</p>
					</div>
					<div class="col-md-8 col-lg-9 py-3 px-4">
						<form method="POST" action="/reserve">
							<input type="hidden" name="start_time" value="{{ $.StartTime.Format "2006-01-02T15:04" }}">
							<input type="hidden" name="end_time" value="{{ $.EndTime.Format "2006-01-02T15:04" }}">
							<input type="hidden" name="chair_id" value="{{ .Id }}">
							<button type="submit" class="btn btn-primary">Reserve</button>
						</form>
					</div>
				</div>
			{{ end }}
		{{ end }}
	</div>
</body>
</html>
