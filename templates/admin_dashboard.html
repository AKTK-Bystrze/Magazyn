<!DOCTYPE html>
<html>
  <head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  </head>
  <body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container">
			<a class="navbar-brand" href="#">Magazyn Bystrze</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ml-auto">
					<li class="nav-item">
						<a class="nav-link" href="/admin">Dashboard</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/logout">Logout</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
    <div class="container">
      <h1 class="my-5">Admin Dashboard</h1>
      <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>User</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {{ range .Reservations }}
          <tr>
            <td>{{ .Name }}</td>
            <td>{{ .StartTime.Format "2006-01-02 15:04:05" }}</td>
            <td>{{ .EndTime.Format "2006-01-02 15:04:05" }}</td>
            <td>{{ .Username }}</td>
            <td>
              <form method="POST" action="/setStatus">
                <input type="hidden" name="reservation_id" value="{{ .ID }}">
                <div class="form-group">
                  <select class="form-control" name="status" onchange="this.form.submit()" autocomplete=off>
                    <option value="pending" {{ if eq .Status "pending" }}selected{{ end }}>Pending</option>
                    <option value="approved" {{ if eq .Status "approved" }}selected{{ end }}>Approved</option>
                    <option value="denied" {{ if eq .Status "denied" }}selected{{ end }}>Cancelled</option>
                  </select>
                </div>
              </form>
            </td>
            <td>
              <form method="POST" action="/deleteReservation">
                <input type="hidden" name="reservation_id" value="{{ .ID }}">
                <button type="submit" class="btn btn-danger">Delete</button>
              </form>
            </td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>
  </body>
</html>
